<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Harness Heavy</title>
<style>
body { font: 16px -apple-system, sans-serif; margin: 40px; }
button { font-size: 18px; margin: 12px; padding: 10px 20px; }
th { position: sticky; top: 0; background: #ffd; text-align: left; }
#status { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 40px; background: #eef; }
</style>
</head>
<body>
<h1>Harness heavy</h1>
<button id="load">Load report</button>
<button id="nothing">Do nothing</button>
<p><label>Name <input id="name"></label></p>
<div id="out"><p>Waiting for a report</p></div>
<table id="rows"><thead><tr><th colspan="4">Sticky release header</th></tr></thead></table>
<p id="status">Pressed none, probe none</p>
<script>
const rows = document.getElementById("rows");
let pressed = "none";
function report() {
  const cell = document.elementFromPoint(60, 300);
  const row = cell && cell.closest("tbody tr");
  const probe = row ? row.cells[0].textContent + " top " + Math.round(row.getBoundingClientRect().top) : "none";
  document.getElementById("status").textContent = "Pressed " + pressed + ", probe " + probe;
}
addEventListener("scroll", report);
const body = rows.createTBody();
for (let i = 1; i <= 1500; i++) {
  const row = body.insertRow();
  row.insertCell().textContent = "Release " + i;
  row.insertCell().textContent = "Track production, rollout " + (i % 100) + "%";
  const cell = row.insertCell();
  const edit = document.createElement("button");
  edit.textContent = "Edit " + i;
  edit.addEventListener("click", () => { pressed = edit.textContent; report(); });
  cell.appendChild(edit);
  const link = document.createElement("a");
  link.href = "#release-" + i;
  link.textContent = "Details " + i;
  row.insertCell().appendChild(link);
}
report();
document.getElementById("load").addEventListener("click", async () => {
  await fetch("https://api.harness.invalid/report").catch(() => {});
  setTimeout(() => {
    history.pushState({}, "", "report");
    document.title = "Report";
    document.getElementById("out").innerHTML = "<h2>Report ready</h2><p>42 installs</p>";
  }, 800);
});
document.getElementById("nothing").addEventListener("click", () => {});
</script>
</body>
</html>
