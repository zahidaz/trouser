<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Harness Settle</title>
<style>
body { font: 16px -apple-system, sans-serif; margin: 40px; }
button { font-size: 18px; margin: 12px; padding: 10px 20px; }
</style>
</head>
<body>
<h1>Settle</h1>
<button id="now">Change now</button>
<button id="nothing">Do nothing</button>
<button id="fetch300">Fetch then change in 300 ms</button>
<button id="fetch1000">Fetch then change in 1 s</button>
<button id="timer300">Change in 300 ms</button>
<button id="next">Open home</button>
<p><label>Name <input id="name"></label></p>
<p id="out">Nothing changed</p>
<script>
let changes = 0;
function change(how) {
  changes += 1;
  document.getElementById("out").textContent = how + " change " + changes;
}
function later(delay, how) {
  return async () => {
    await fetch("https://api.harness.invalid/settle").catch(() => {});
    setTimeout(() => change(how), delay);
  };
}
document.getElementById("now").addEventListener("click", () => change("Immediate"));
document.getElementById("nothing").addEventListener("click", () => {});
document.getElementById("fetch300").addEventListener("click", later(300, "Fetched 300 ms"));
document.getElementById("fetch1000").addEventListener("click", later(1000, "Fetched 1 s"));
document.getElementById("timer300").addEventListener("click", () => setTimeout(() => change("Timed 300 ms"), 300));
document.getElementById("next").addEventListener("click", () => { location.href = "index.html"; });
</script>
</body>
</html>
